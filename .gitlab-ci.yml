# Draft pipeline. Cross builds use cargo-zigbuild, so a single Linux runner builds every target.
# The image only needs Docker; tools are installed by cargo-binstall (prebuilt binaries, no compilation).
stages: [check, build]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.16.0"

default:
  image: rust:1.95-bookworm
  cache:
    key: cargo-$CI_COMMIT_REF_SLUG
    paths: [.cargo-home/registry, .cargo-home/git, target]

.tools: &tools
  - rustup show
  - curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
  - cargo binstall -y cargo-zigbuild
  - curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /opt
  - export PATH="/opt/zig-x86_64-linux-${ZIG_VERSION}:$PATH"

check:
  stage: check
  script:
    - cargo fmt --check
    - cargo clippy --all-targets --locked -- -D warnings
    - cargo test --locked

# Type checks the non-Linux code paths without linking (fast).
check-windows:
  stage: check
  before_script: *tools
  script:
    # aws-lc and mimalloc compile C code: reuse the zig cc wrapper generated by one zigbuild run.
    - cargo zigbuild --target x86_64-pc-windows-gnu --locked --release || true
    - export CC_x86_64_pc_windows_gnu=$(ls ~/.cache/cargo-zigbuild/*/wrappers/*/zigcc-x86_64-pc-windows-gnu-*.sh | head -1)
    - cargo clippy --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings

build:
  stage: build
  needs: [check, check-windows]
  before_script: *tools
  script:
    - scripts/build-release.sh
  artifacts:
    name: paasers-$CI_COMMIT_REF_SLUG
    paths: [dist/]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

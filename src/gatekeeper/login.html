<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>{{TITLE}}</title>
<style nonce="{{NONCE}}">body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#1c1e21}main{width:100%;max-width:22rem;padding:2rem;background:#fff;border-radius:12px;box-shadow:0 2px 12px #0002}h1{font-size:1.3rem;margin:0 0 .25rem}p.sub{margin:0 0 1.25rem;color:#6b7280}label{display:block;font-size:.85rem;margin:.75rem 0 .25rem}input{width:100%;box-sizing:border-box;padding:.6rem;border:1px solid #c5c9d0;border-radius:6px;font-size:1rem}button{width:100%;margin-top:1rem;padding:.65rem;border:0;border-radius:6px;background:#2563eb;color:#fff;font-size:1rem;cursor:pointer}.err{background:#fee2e2;color:#991b1b;padding:.5rem .75rem;border-radius:6px}@media(prefers-color-scheme:dark){body{background:#16181c;color:#e6e8eb}main{background:#20232a}input{background:#16181c;color:#e6e8eb;border-color:#3b3f47}p.sub{color:#9ca3af}}</style></head>
<body><main><h1>{{TITLE}}</h1>
{{MESSAGE}}
<p class="sub">This environment is protected.</p>
<form method="post" action="/__gate/login"><input type="hidden" name="next" value="{{NEXT}}">
<label for="pw">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
{{TOTP_FIELD}}<button type="submit">Enter</button></form>
</main>
</body></html>

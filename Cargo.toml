[package]
name = "paasers"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "PaaS edge gateway & ingress proxy"
repository = "https://github.com/s-ted/paasers"
readme = "README.md"
keywords = ["reverse-proxy", "gateway", "acme", "ingress", "tls"]
categories = ["network-programming", "web-programming::http-server", "command-line-utilities"]
# Only what is needed to build: tests, plans and fixtures stay in the git repository.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

# `cargo binstall paasers`: prebuilt archives attached to the GitHub release by .github/workflows/release.yml.
# Archive layout: paasers-<version>-<target>/paasers[.exe] (+ README and licenses), signed with minisign.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWSejPf058zYfUwKUqoKW+2SIIY7g4Ahz7Ku6o0pzoiscLGHyr1bxaD1"

# Static musl binaries run on any Linux: serve them to glibc hosts too.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-{ version }-x86_64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-{ version }-aarch64-unknown-linux-musl/{ bin }"

# Windows is built with the gnu ABI (zig), statically linked: also the answer for msvc hosts.
[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-pc-windows-gnu.zip"
bin-dir = "{ name }-{ version }-x86_64-pc-windows-gnu/{ bin }.exe"
pkg-fmt = "zip"

[lib]
path = "src/lib.rs"

[[bin]]
name = "paasers"
path = "src/main.rs"

[dependencies]
# runtime / http
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
hyper = { version = "1.11", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
http = "1.5"
http-body = "1"
http-body-util = "0.1.5"
bytes = "1.12"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip", "compression-br", "compression-zstd", "fs"] }
percent-encoding = "2.3"
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
futures-util = "0.3.34"
pin-project-lite = "0.2.17"
socket2 = { version = "0.6.5", features = ["all"] }
# tls / acme
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-pki-types = "1.15"
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = "0.18.1"
# storage / routing / config
rusqlite = { version = "0.40.2", features = ["bundled"] }
matchit = "0.9.2"
arc-swap = "1.9.2"
kdl = { version = "6.7.1", default-features = false, features = ["span", "v1-fallback"] }
humantime = "2.4"
bytesize = "2.7"
ipnet = "2.12"
regex-lite = "0.1"
# features
governor = { version = "0.10.4", default-features = false, features = ["std", "quanta", "dashmap"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
argon2 = "0.6"
totp-rs = "6"
maxminddb = { version = "0.32", features = ["mmap"] }
quick_cache = "0.7"
httpdate = "1.0.3"
# observability / mcp
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "ansi", "std"] }
fastrace = "0.7.19"
rmcp = { version = "=3.5.0", features = ["server", "macros", "transport-streamable-http-server"] }
# misc
thiserror = "2.0.21"
anyhow = "1.0.104"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
hex = "0.4.3"
base64 = "0.23"
rand = "0.10"
url = "2.5"
clap = { version = "4.6", features = ["derive"] }
mimalloc = { version = "0.1.52", default-features = false }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
tempfile = "3"

# Dev builds: less debuginfo to emit and link, dependencies built with light optimisation.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Proc macros and build scripts run on the host: optimise them once, they are rebuilt rarely.
[profile.dev.build-override]
opt-level = 1

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Quick release-like build for CI smoke tests and local benchmarks: `cargo build --profile release-fast`.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions # actions are pinned by SHA: Dependabot bumps SHA and version comment
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

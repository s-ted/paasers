# Reusable: release archives for every target, cross compiled with cargo-zigbuild on one x64 Linux runner.
# Called by ci.yml (dry run on every PR) and release.yml (tag). Same script as locally: scripts/build-release.sh.
name: build

on:
  workflow_call:
    inputs:
      save-cache:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  ZIG_VERSION: 0.16.0
  ZIGBUILD_VERSION: 0.23.4

jobs:
  archive:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install # from rust-toolchain.toml (version, components, targets)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ inputs.save-cache }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.target }}
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
      - run: cargo binstall -y --locked cargo-zigbuild@${{ env.ZIGBUILD_VERSION }}
      - run: scripts/build-release.sh ${{ matrix.target }}
      - name: Memory budget (32 MB RSS)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: scripts/rss.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/paasers-*.tar.gz
            dist/paasers-*.zip
          if-no-files-found: error
          retention-days: 7

name: ci

on:
  pull_request:
  push:
    branches: [main] # also refreshes the caches that pull requests restore from
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci.sh # fmt, clippy -D warnings, file length

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners: x64, arm64 (the Raspberry Pi architecture) and Windows, free on public repositories.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked

  acme:
    name: acme (pebble)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: acme
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/pebble.sh
      - run: cargo test --locked --test acme -- --ignored
        env:
          PEBBLE_DIR: target/pebble

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  package:
    name: crates.io dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Builds the packaged crate alone: catches files missing from `include`.
      - run: cargo publish --dry-run --locked

  build:
    uses: ./.github/workflows/build.yml
    with:
      save-cache: ${{ github.ref == 'refs/heads/main' }}

  binstall-layout:
    name: binstall layout
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Archive names and paths must match [package.metadata.binstall]; no key on PRs, so no signature check.
      - run: REQUIRE_SIG=0 scripts/check-binstall.sh

  # Single required check for the `main` ruleset: adding a job, target or runner needs no ruleset change.
  # `always()` matters: a skipped required check counts as passed, so this job must run and fail explicitly.
  # `acme` is left out on purpose (it downloads pebble, a network hiccup must not block merges).
  ci-ok:
    if: always()
    needs: [lint, test, deny, package, build, binstall-layout]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs succeeded
        run: |
          echo "$RESULTS" | jq .
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" >/dev/null
        env:
          RESULTS: ${{ toJSON(needs) }}

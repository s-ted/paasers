# Release on a `vX.Y.Z` tag (matching Cargo.toml): signed archives on the GitHub release, then crates.io, then
# an end-to-end `cargo binstall --only-signed` on Linux x64, Linux arm64 and Windows.
#
# One-time setup (see README, "Releasing"):
#   * secret MINISIGN_KEY: content of the minisign secret key whose public key is pinned in Cargo.toml;
#   * crates.io: trusted publishing for this repository and workflow `release.yml`, environment `release`
#     (before the very first publication, which needs a token: secret CARGO_REGISTRY_TOKEN, deleted afterwards).
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  MINISIGN_VERSION: "0.12"
  MINISIGN_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "paasers") | .version')
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  github-release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: |
          curl -sSfL -o /tmp/minisign.tgz \
            "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz"
          echo "${MINISIGN_SHA256}  /tmp/minisign.tgz" | sha256sum -c -
          tar -xzf /tmp/minisign.tgz -C /tmp
          sudo install /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
      - name: Sign (checked against the pubkey pinned in Cargo.toml)
        run: scripts/sign-release.sh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
      - run: cd dist && sha256sum paasers-*.tar.gz paasers-*.zip > SHA256SUMS
      - run: scripts/check-binstall.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/paasers-*.tar.gz
            dist/paasers-*.zip
      # Two steps for immutable releases: assets can only be attached while the release is a draft,
      # publishing then locks both the assets and the tag.
      - name: Create a draft release with every asset
        run: |
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${pre[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Check the draft, then publish
        run: |
          expected=$(find dist -maxdepth 1 -type f | wc -l)
          attached=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          [[ "$attached" == "$expected" ]] || { echo "::error::$attached assets attached, $expected expected"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  crates-io:
    needs: github-release # binaries are public before binstall can find the crate
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
        continue-on-error: true # first publication: no trusted publisher yet, the token secret is used instead
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  binstall:
    name: binstall (${{ matrix.os }})
    needs: [version, crates-io]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    steps:
      - uses: cargo-bins/cargo-binstall@a29e25869a42756b3be062dc4dae3e4b01bb4f38 # v1.25.0
      - name: Install the published release (signed binaries only, no source build)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do # the crates.io index can take a minute to show the new version
            cargo binstall -y --only-signed --disable-strategies compile,quick-install "paasers@$VERSION" && break
            [[ $i == 6 ]] && exit 1
            sleep 20
          done
          paasers version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits

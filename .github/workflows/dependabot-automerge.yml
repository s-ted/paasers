# Auto-merge Dependabot patch updates once the required check (`ci-ok`) passes.
# Needs the repository setting "Allow auto-merge" and the `main` ruleset requiring `ci-ok`:
# without a required check, auto-merge would merge immediately.
# Minor and major updates stay open for a manual review.
name: dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 's-ted/paasers'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # merge
      pull-requests: write # enable auto-merge
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge (rebase) for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
